# The suite on every push, and the balance tier every night.
#
# The fast gate is what `bash tools/run_tests.sh` runs by hand: every script
# parses, every test file in the fast tier, and the ink/shape sweep at four
# handset shapes under xvfb. The balance tier (statistical melee measures, C-6)
# runs nightly and on demand, because tuning work must not turn the push gate
# red — but it must be run before a balance change ships.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"    # 03:17 Central, nightly

env:
  GODOT_VERSION: 4.6.2-stable

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Godot
        run: |
          mkdir -p /tmp/godot462
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot462
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Fast gate
        if: github.event_name != 'schedule'
        run: bash tools/run_tests.sh
      - name: Balance tier
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash tools/run_tests.sh --balance
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/tests/
