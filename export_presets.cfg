launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
launcher_icons/adaptive_monochrome_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=0
; ORIENTATION IS NOT SET HERE, and that is worth writing down rather than
; leaving as an absence. Godot's Android exporter writes `android:screenOrientation`
; into the manifest from `display/window/handheld/orientation` in project.godot —
; there is no preset key for it, so this file cannot contradict the project and
; cannot be "fixed" here if it is ever wrong again. On 15 Sep 2026 that project
; setting was PORTRAIT under a landscape game; it is 4, SENSOR_LANDSCAPE, now,
; and `tests/test_export.gd` holds it there.
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/custom_permissions=PackedStringArray()
; BILLING, for the credit unlock. The permission is the only manifest entry
; Google Play Billing needs; the library itself arrives as an Android plugin,
; which needs `gradle_build/use_gradle_build=true` and an Android build template
; installed from the editor. Until that is done `Store` runs on its stub
; backend — see `scripts/game/store.gd`, which says so on the screen rather than
; pretending a purchase succeeded.
permissions/com_android_vending_billing=true
permissions/access_network_state=true
permissions/internet=true

