; 8-Bit Buhurt: Combat Club — export presets
;
; WRITTEN BY HAND, 15 Sep 2026. Godot normally generates this from the export
; dialog, and there is no editor in this loop — so it is written out, commented,
; and checked by `tests/test_export.gd` rather than trusted.
;
; WHAT IS DELIBERATELY NOT IN HERE: a keystore path, a keystore password, an
; Apple team id, or any other credential. Those are per-machine, and a repo that
; carries them is a repo that leaks them.
;
; This file IS tracked, which is the opposite of the usual advice — see the note
; in `.gitignore`. It is safe to track only because it holds no secret, and
; `tests/test_export.gd` fails if a keystore field is ever filled in.
;
; PROVEN, NOT ASSUMED. The Linux preset was exported on 15 Sep 2026 and the
; resulting 90MB binary was run: it starts, plays and quits clean. The Android
; preset parses and is correct, and refuses on this machine for the one reason
; that is not a repo problem — no Android SDK. See docs/EXPORTING.md for the
; exact errors and what answers them.

