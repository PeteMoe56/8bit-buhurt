; 8-Bit Buhurt: Combat Club — export presets
;
; WRITTEN BY HAND, 15 Sep 2026. Godot normally generates this from the export
; dialog, and there is no editor in this loop — so it is written out, commented,
; and checked by `tests/test_export.gd` rather than trusted.
;
; WHAT IS DELIBERATELY NOT IN HERE: a keystore path, a keystore password, an
; Apple team id, or any other credential. Those are per-machine, and a repo that
; carries them is a repo that leaks them.
;
; This file IS tracked, which is the opposite of the usual advice — see the note
; in `.gitignore`. It is safe to track only because it holds no secret, and
; `tests/test_export.gd` fails if a keystore field is ever filled in.
;
; PROVEN, NOT ASSUMED. The Linux preset was exported on 15 Sep 2026 and the
; resulting 90MB binary was run: it starts, plays and quits clean. The Android
; preset parses and is correct, and refuses on this machine for the one reason
; that is not a repo problem — no Android SDK. See docs/EXPORTING.md for the
; exact errors and what answers them.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="fonts/OFL.txt, fonts/fallback/LanaPixel-OFL.txt, art/ui/KENNEY-LICENSE.txt"
; WHAT NEVER SHIPS (29 Sep 2026, measured by the fresh-eyes audit: 20.8 MB of a
; 32.6 MB pack was this). `audio/_candidates` (4.5 MB of auditions) and
; `audio/music/_archive` (12.5 MB of retired tracks); the full 7 MB album MP3
; in the repo root, which is licensed as a 29.7 s loop and must not ship whole;
; `Assets/` (the 0.9 MB source logo), `Claude outputs/` (review images) and the
; font specimen PNGs. `tests/test_export.gd` holds every entry in all three.
exclude_filter="audio/_candidates/*, audio/music/_archive/*, shots/*, docs/*, tools/*, tests/*, Assets/*, Claude outputs/*, build/*, *.mp3, font-*.png, addons/godotsteam/*"
export_path="build/combat-club.aab"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; GRADLE, AN APP BUNDLE, API 36 (29 Sep 2026). Play takes new apps only as an
; AAB, and from 31 Aug 2026 only targeting API 36; Godot's default template
; targets 35, and both the AAB and the target SDK are only settable with a
; gradle build. That needs the Android build template installed into `android/`
; once, from the editor (Project > Install Android Build Template) — see
; docs/EXPORTING.md. min SDK 24 is Godot 4.6's own floor.
gradle_build/use_gradle_build=true
gradle_build/gradle_build_directory="res://android"
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=1
gradle_build/min_sdk="24"
gradle_build/target_sdk="36"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
; x86_64 stays on for emulators and for Chromebooks, which the Play listing
; already reports as a supported device class.
architectures/x86_64=true
version/code=6
version/name="1.0.2"
package/unique_name="com.bonkworks.combatclub"
package/name="8-Bit Buhurt"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
; THE LAUNCHER ICONS ARE REAL NOW, and the adaptive foreground is NOT the same
; picture as the square one. Android masks the outer third of an adaptive icon
; away — circle on Pixel, squircle on Samsung — so a foreground drawn to its own
; edges loses the shield's shoulders on most phones. `adaptive_fg_432.png` sits
; the crest inside the middle 66% for exactly that reason, and the background is
; the game's own ground colour rather than white.
launcher_icons/main_192x192="res://art/brand/crest_192.png"
launcher_icons/adaptive_foreground_432x432="res://art/brand/adaptive_fg_432.png"
launcher_icons/adaptive_background_432x432="res://art/brand/adaptive_bg_432.png"
launcher_icons/adaptive_monochrome_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=0
; ORIENTATION IS NOT SET HERE, and that is worth writing down rather than
; leaving as an absence. Godot's Android exporter writes `android:screenOrientation`
; into the manifest from `display/window/handheld/orientation` in project.godot —
; there is no preset key for it, so this file cannot contradict the project and
; cannot be "fixed" here if it is ever wrong again. On 15 Sep 2026 that project
; setting was PORTRAIT under a landscape game; it is 4, SENSOR_LANDSCAPE, now,
; and `tests/test_export.gd` holds it there.
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
; BACKUP ON (29 Sep 2026): a career is ~70 KB, and with this off a player who
; changes phones loses it.
user_data_backup/allow=true
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/custom_permissions=PackedStringArray()
; BILLING, for the credit unlock. The permission is the only manifest entry
; Google Play Billing needs; the library itself arrives as an Android plugin,
; which needs `gradle_build/use_gradle_build=true` and an Android build template
; installed from the editor. Until that is done `Store` runs on its stub
; backend — see `scripts/game/store.gd`, which says so on the screen rather than
; pretending a purchase succeeded.
permissions/com_android_vending_billing=true
; NO NETWORK PERMISSIONS (29 Sep 2026). Nothing in the game opens a socket, and
; Play Billing reaches the network through the Play Store app, not through
; this one. Asking for INTERNET with no use for it is a line on the store page
; and a question in the data-safety form for nothing.
permissions/access_network_state=false
permissions/internet=false
; A TICK UNDER THE THUMB (2 Oct 2026): the fight corner buzzes on a pick and on a refusal.
permissions/vibrate=true

