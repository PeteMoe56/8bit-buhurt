name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; The candidates folder is 20MB of audition tracks that never ship. `audio/`
; itself is 25MB and the game uses about 5 of it.
exclude_filter="audio/_candidates/*, shots/*, docs/*, tools/*, tests/*"
export_path="build/combat-club.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

